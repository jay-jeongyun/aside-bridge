<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>aside-bridge social preview</title>
<!-- GitHub social preview, exactly 1280x640. Rendered by render.mjs (mode: social). -->
<style>
  :root { --bg:#0a0d14; --line:#1f2633; --mint:#5eead4; --blue:#7aa2ff; --dim:#6b7587;
    --mono: Menlo, ui-monospace, "SF Mono", SFMono-Regular, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { font-family: var(--sans); color: #e6ebf3; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(760px 420px at 18% 10%, #13203a 0%, rgba(10,13,20,0) 65%),
      radial-gradient(620px 380px at 92% 95%, rgba(94,234,212,.10) 0%, rgba(10,13,20,0) 70%),
      var(--bg); position: relative; }
  .grid { position: absolute; inset: 0; opacity: .35;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 40px 40px; -webkit-mask-image: radial-gradient(900px 500px at 50% 40%, #000 30%, transparent 80%); }
  .wrap { position: absolute; left: 100px; top: 112px; right: 100px; }
  .chip { display: inline-flex; gap: 10px; align-items: center; font-family: var(--mono); font-size: 18px; color: #8d97aa;
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 10px var(--mint); display: block; }
  h1 { margin-top: 26px; font-family: var(--mono); font-size: 92px; font-weight: 700; letter-spacing: -2px; color: #f3f6fb; line-height: 1; }
  h1 b { color: var(--mint); }
  .tag { margin-top: 22px; font-size: 34px; color: #b3bccc; letter-spacing: -.2px; }
  .term { margin-top: 38px; display: inline-flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 24px;
    background: #10141d; border: 1px solid var(--line); border-radius: 14px; padding: 16px 24px; box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  .term .ps { color: var(--mint); }
  .term .s { color: #f5c26b; }
  .term .f { color: var(--blue); }
  .term .c { display: inline-block; width: 12px; height: 26px; background: var(--mint); margin-left: -6px; }
  .diag { position: absolute; left: 100px; right: 100px; bottom: 54px; display: flex; align-items: center; opacity: .62; }
  .nd { font-family: var(--mono); font-size: 18px; color: #9aa4b7; border: 1px solid #2a3243; border-radius: 12px; padding: 10px 18px; background: rgba(16,20,29,.7); white-space: nowrap; }
  .nd.mid { color: var(--mint); border-color: rgba(94,234,212,.45); box-shadow: 0 0 20px rgba(94,234,212,.15); }
  .ar { flex: 1; height: 2px; margin: 0 16px; position: relative;
    background: repeating-linear-gradient(90deg, #3a4458 0 10px, transparent 10px 18px); }
  .ar::after { content: ""; position: absolute; right: -2px; top: -5px; border-left: 9px solid #3a4458; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .apps { display: flex; gap: 8px; }
  .apps span { width: 34px; height: 34px; border-radius: 9px; display: block; opacity: .85; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="chip"><i></i>macOS · Windows · open source · local only</div>
    <h1>aside<b>-</b>bridge</h1>
    <div class="tag">Let sandboxed AI agents control native desktop apps</div>
    <div class="term"><span class="ps">$</span><span>bridgectl ocr <span class="f">--win</span> Safari <span class="f">--find</span> <span class="s">"Sign in"</span></span><span class="c"></span></div>
  </div>
  <div class="diag">
    <div class="nd">sandboxed agent</div><div class="ar"></div>
    <div class="nd mid">aside-bridge</div><div class="ar"></div>
    <div class="nd">desktop apps</div>
    <div class="apps" style="margin-left:14px">
      <span style="background:linear-gradient(#5aa9ff,#2c6fe0)"></span>
      <span style="background:linear-gradient(#ffd66b,#f0a92a)"></span>
      <span style="background:linear-gradient(#5d6270,#383c46)"></span>
    </div>
  </div>
</body>
</html>
